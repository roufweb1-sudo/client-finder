# Nginx site for Client Finder. Replace YOURDOMAIN.com (2 places), then:
#   sudo cp nginx-client-finder.conf /etc/nginx/sites-available/client-finder
#   sudo ln -s /etc/nginx/sites-available/client-finder /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOURDOMAIN.com -d www.YOURDOMAIN.com
server {
    listen 80;
    server_name YOURDOMAIN.com www.YOURDOMAIN.com;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
